<mat-card>


 
  <mat-toolbar color="primary" style="margin-top: 10px;">Pessoas Inativas</mat-toolbar>
  <mat-table [dataSource]="pessoasInativas" class="mat-elevation-z8">

    <!-- Coluna de identidade -->
    <ng-container matColumnDef="identidade">
      <mat-header-cell *matHeaderCellDef>Identidade</mat-header-cell>
      <mat-cell *matCellDef="let pessoa">{{ pessoa.identidade }}</mat-cell>
    </ng-container>

    <!-- Coluna de nome -->
    <ng-container matColumnDef="nome">
      <mat-header-cell *matHeaderCellDef>Nome</mat-header-cell>
      <mat-cell *matCellDef="let pessoa">{{ pessoa.nome }}</mat-cell>
    </ng-container>

    <!-- Coluna de Posto ou grduação -->
    <ng-container matColumnDef="postoGraduacao">
      <mat-header-cell *matHeaderCellDef class="column-header-posto">Posto/Graduação</mat-header-cell>
      <mat-cell *matCellDef="let pessoa" class="column-posto">
        <div class="posto-container">
          <img [src]="getPostoImage(pessoa.postoGraduacao)" class="img-patente">
          <span>{{ pessoa.postoGraduacao }}</span>
        </div>
      </mat-cell>
    </ng-container>

    <!-- Coluna de nome de Guerra -->
    <ng-container matColumnDef="nomeGuerra">
      <mat-header-cell class="column-header-nomeGuerra" *matHeaderCellDef>Nome de Guerra</mat-header-cell>
      <mat-cell mat-cell *matCellDef="let pessoa" class="column-nomeGuerra"> {{ pessoa.nomeGuerra }}

      </mat-cell>
    </ng-container>

    <!-- Coluna de ações -->
    <ng-container matColumnDef="acoes">
      <mat-header-cell *matHeaderCellDef>Ações</mat-header-cell>
      <mat-cell *matCellDef="let pessoa">
         

        <button mat-raised-button color="primary" *ngIf="pessoa._id" (click)="reativarPessoa(pessoa._id)">
          Reativar
        </button>

      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>

  <!-- Paginação -->
  <mat-paginator [pageSizeOptions]="[5, 10, 15]" showFirstLastButtons [pageIndex]="pageIndex" [pageSize]="pageSize"
    [length]="totalElements" (page)="refresh($event)">
  </mat-paginator>


</mat-card>
