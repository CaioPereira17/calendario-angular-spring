<mat-card>
  <mat-toolbar color="primary">Assessorias do DECEx

    <div  class="campo-pesquisa">

      <mat-form-field class="input-pesquisa-assessoria">

        <mat-label>Pesquise pela sigla da Assessoria</mat-label>
        <mat-select (selectionChange)="onSearchTermChange($event.value)">

          <input class="input-pesquisa" (input)="filterSelectDeAssessorias($event)" placeholder="Digite ou selecione para filtrar"/>

          <mat-option [value]="">
            Nenhum
          </mat-option>

          @for (assessoria of assessorias; track assessoria) {
            <mat-option [value]="assessoria.sigla"> {{ assessoria.sigla }}</mat-option>
          }
        </mat-select>

      </mat-form-field>

    </div>

  </mat-toolbar>

  <div class="mat-elevation-z8">
      @if (assessorias2$ | async; as assessorias) {
      <app-assessorias-lista
        [assessorias]="assessorias.assessorias"
        (add)="onAdd()"
        (edit)="onEdit($event)"
        (delete)="onRemove($event)"
      ></app-assessorias-lista>

      <mat-paginator
        [pageSizeOptions]="[5, 20, 50]"
        showFirstLastButtons
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [length]="assessorias.totalElements"
        (page)="refresh2($event)"
        aria-label="Selecione a página de assessorias">
      </mat-paginator>


  } @else {
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  }

  <ng-template #loading>
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</div>
</mat-card>
